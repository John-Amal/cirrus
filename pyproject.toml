[project]
name = "cirrus"
version = "0.0.1"
description = "A small weather foundation model, built end to end."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amal John" }]
keywords = ["machine-learning", "pytorch", "weather", "foundation-models", "era5"]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "xarray>=2024.6",
    "zarr>=2.18",
    "gcsfs>=2024.6",  # anonymous reads from public Google Cloud buckets
    "matplotlib>=3.8",  # diagnostics and README figures
]

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]  # only needed to publish the checkpoint
dev = [
    "pytest>=8.0",
    "ruff==0.16.8",  # pinned: lint tools are pinned, libraries float
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
]

[project.scripts]
cirrus = "cirrus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirrus"]
# Ship the typing marker so downstream users get the annotations too.
artifacts = ["src/cirrus/py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"
# Say explicitly which directories are first-party. Without this, ruff infers
# it, and the inference differs between a machine where the package is
# pip-installed and one where it is not -- so import sorting passed locally
# and failed in CI.
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# D107: __init__ args are documented on the class docstring instead.
ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.isort]
# Declared, not inferred. Ruff otherwise guesses from whether the package is
# importable, which differs between a dev machine and a CI runner that has
# pip-installed it -- so the same file sorted two different ways.
known-first-party = ["cirrus"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.mypy]
# Resolve the package from source rather than from the editable install,
# and pair that with the py.typed marker in src/cirrus/. Without the marker
# an installed package counts as untyped however well annotated it is, so
# `mypy src` fails on CI while passing on a machine where it is not installed.
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
