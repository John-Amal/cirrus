[project]
name = "cirrus"
version = "0.0.1"
description = "A small weather foundation model, built end to end."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Amal John" }]
keywords = ["machine-learning", "pytorch", "weather", "foundation-models", "era5"]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "xarray>=2024.6",
    "zarr>=2.18",
    "gcsfs>=2024.6",  # anonymous reads from public Google Cloud buckets
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML",
]

[project.scripts]
cirrus = "cirrus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cirrus"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
# D107: __init__ args are documented on the class docstring instead.
ignore = ["D100", "D104", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
