# The sanity config: trains in seconds on any machine, including CI.
# Every code change gets validated against this before anything long-running
# starts. This habit will save you more time than any optimisation.
name: tiny
seed: 0

n_samples: 512
n_channels: 4
grid_height: 32
grid_width: 64

hidden_dim: 64

batch_size: 32
epochs: 3
learning_rate: 0.001

device: null
